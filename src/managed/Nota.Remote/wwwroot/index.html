<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1E1F22">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- No black-translucent: since iOS 26 it lays a Liquid Glass blur over the top of a Home
       Screen app and reports the viewport a status bar short (a dead band under the tabs).
       The default style starts the page below an opaque bar tinted by theme-color. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Nota Remote">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="preload" href="./fonts/Geist-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <title>Nota Remote</title>
  <!-- A returning phone paints in the theme it last wore, before the app loads (spec 014;
       src/lib/theme.svelte.ts stores it). A new one gets the built-in fallback. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('nota-remote:vars') || 'null'), r = document.documentElement;
      if (s && s.v) {
        r.dataset.theme = s.dark ? 'dark' : 'light';
        for (var k in s.v) r.style.setProperty(k, s.v[k]);
        if (s.v['--bg-app']) document.querySelector('meta[name=theme-color]').setAttribute('content', s.v['--bg-app']);
      }
    } catch (e) { /* private mode, or nothing stored */ }
  </script>
  <script type="module" crossorigin src="./assets/index-DT5MFtDx.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-kPw-fb1K.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
